name: Create Pull Request

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  create-pull-request:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create pull request
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.ref_name }}
          BASE_BRANCH: main
        run: |
          existing_pr_url="$(gh pr list \
            --head "$HEAD_BRANCH" \
            --base "$BASE_BRANCH" \
            --state open \
            --json url \
            --jq '.[0].url')"

          if [ -n "$existing_pr_url" ]; then
            echo "Pull request already exists for $HEAD_BRANCH: $existing_pr_url"
            echo "pr_url=$existing_pr_url" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pr_url="$(gh pr create \
            --base "$BASE_BRANCH" \
            --head "$HEAD_BRANCH" \
            --title "Auto PR: $HEAD_BRANCH" \
            --body "Automatically created from push to \`$HEAD_BRANCH\`.")"

          echo "Created pull request: $pr_url"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Run PR Agent review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
          PR_URL: ${{ steps.create_pr.outputs.pr_url }}
        run: |
          python -m pip install --upgrade pip pr-agent
          /usr/bin/env \
            "GITHUB.USER_TOKEN=$GITHUB_TOKEN" \
            "OPENAI.KEY=$OPENAI_KEY" \
            python -m pr_agent.cli --pr_url="$PR_URL" review
          /usr/bin/env \
            "GITHUB.USER_TOKEN=$GITHUB_TOKEN" \
            "OPENAI.KEY=$OPENAI_KEY" \
            python -m pr_agent.cli --pr_url="$PR_URL" improve
